<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="author" content="Azphire">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间侦探——“平庸侦探破解发生的案件，而我，阻止案件的发生。”</title>
<style>
  :root{
    --bg:#f6f5f1; --paper:#ffffff; --ink:#1a1a1a; --muted:#8b8a84; --faint:#c9c7bf; --line:#dddbd3;
    --bad:#b3261e; --ok:#1f6b45;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); }
  body{ font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif; font-size:14px; line-height:1.6; }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  .num{ font-variant-numeric:tabular-nums; }

  /* top */
  .top{ display:flex; align-items:center; gap:28px; padding:0 32px; border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:10; flex-wrap:wrap; }
  .brand .motto{ font-weight:400; letter-spacing:.02em; color:var(--muted); margin-left:2px; }
  .brand{ font-weight:600; letter-spacing:.12em; padding:14px 0; }
  #tabs{ display:flex; gap:24px; flex:1; }
  #tabs[hidden]{ display:none; }
  .top .spacer{ flex:1; }
  .tab{ padding:14px 0 13px; border-bottom:2px solid transparent; color:var(--muted); white-space:nowrap; font-size:13px; }
  .tab:hover{ color:var(--ink); }
  .tab.cur{ color:var(--ink); border-bottom-color:var(--ink); font-weight:600; }
  .tab .ck{ color:var(--ok); margin-left:4px; }
  #runCount{ font-size:13px; color:var(--muted); }

  main{ max-width:1640px; margin:0 auto; padding:40px 32px 80px; }
  section{ margin-bottom:44px; }
  .eyebrow{ font-size:12px; letter-spacing:.24em; color:var(--muted); }
  h1{ font-size:30px; font-weight:600; margin:6px 0 10px; letter-spacing:.02em; }
  h2{ font-size:15px; font-weight:600; margin:0; letter-spacing:.08em; }
  #brief{ margin:0 0 10px; color:#3d3c38; }
  #note{ margin:0 0 14px; font-size:13px; color:#3d3c38; border-left:2px solid var(--ink); padding:2px 0 2px 10px; }
  #note[hidden]{ display:none; }
  #note b{ font-weight:600; margin-right:6px; }
  .goal{ font-size:13px; color:var(--muted); }
  .goal b{ color:var(--ink); font-weight:600; margin-left:8px; }
  .sec-head{ display:flex; align-items:baseline; gap:16px; margin-bottom:16px; flex-wrap:wrap; border-bottom:1px solid var(--ink); padding-bottom:8px; }
  .sec-head p{ margin:0; color:var(--muted); font-size:13px; }

  /* tutorial */

  /* 明线：横向角色，纵向时间点，分叉的分支左右并排 */
  .lines{ display:flex; overflow-x:auto; border:1px solid var(--line); background:var(--paper); }
  .line{ border-right:1px solid var(--line); padding:16px 18px 14px; }
  .line:last-child{ border-right:0; }
  .line-head{ display:flex; align-items:center; gap:8px; margin-bottom:14px; white-space:nowrap; }
  .line-head b{ font-weight:600; }
  .line-head em{ font-style:normal; font-size:12px; color:var(--muted); margin-left:auto; }
  .path{ border-left:1px solid var(--line); margin-left:5px; }
  .node{ position:relative; display:flex; align-items:flex-start; gap:10px; padding:4px 0 12px 0; margin-left:-6px; cursor:pointer; width:calc(100% + 6px); text-align:left; }
  .line.fixed .node{ cursor:default; }
  .node .dot{ width:11px; height:11px; margin-top:6px; border-radius:50%; border:1px solid var(--faint); background:var(--paper); flex:none; }
  .node .st{ flex:1; min-width:0; }
  .st-l{ font-weight:500; }
  .st-m{ font-size:12px; color:var(--muted); }
  .node .tag{ font-size:12px; white-space:nowrap; padding-top:1px; }
  .node.in .dot{ border-color:var(--ink); }
  .node.start .dot{ background:var(--ink); border-color:var(--ink); }
  .node.start .tag::before{ content:"▸ "; }
  .node.taken .st-l{ text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:4px; }
  .node.taken .dot{ background:var(--ink); border-color:var(--ink); }
  .node.past .st-l, .node.past .st-m, .node.past .tag,
  .node.off .st-l, .node.off .st-m, .node.off .tag,
  .node.out .st-l, .node.out .st-m{ color:var(--faint); }
  .line:not(.fixed) .node:not(.start):hover .st-l{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  .fork{ display:flex; gap:14px; margin-left:-1px; padding-top:2px; }
  .branch{ flex:1; min-width:124px; }
  .branch.unknown{ flex:0 0 46px; min-width:46px; }
  .branch .q{ color:var(--faint); font-size:15px; padding:4px 0 0 12px; }
  .branch .cond{ font-size:11px; letter-spacing:.06em; color:var(--muted); border-top:1px solid var(--ink); padding:4px 0 6px 0; margin-left:5px; white-space:nowrap; }
  .branch.live .cond{ color:var(--ink); font-weight:600; }
  .scene-strip{ display:flex; flex-wrap:wrap; gap:6px 22px; padding:10px 0 0; font-size:13px; color:#3d3c38; }
  .scene-strip b{ font-weight:600; color:var(--ink); }

  .tok{ display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; font-size:12px; line-height:1; flex:none;
        background:var(--ink); color:var(--paper); border:1px solid var(--ink); }
  .tok.sleep{ background:var(--paper); color:var(--muted); border-color:var(--faint); }
  .tok.sneak{ background:var(--paper); color:var(--bad); border:1px dashed var(--bad); }

  .run-bar{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  #runBtn{ background:var(--ink); color:var(--paper); padding:11px 22px; font-weight:600; letter-spacing:.06em; }
  #runBtn:hover{ background:#000; }
  .run-bar .hint{ color:var(--muted); font-size:13px; max-width:640px; }

  /* 推演网格：横向房间，纵向钟点 */
  .res-tools{ margin-left:auto; display:flex; gap:0; border:1px solid var(--ink); }
  .res-tools[hidden]{ display:none; }
  .res-tools button{ font-size:12px; padding:3px 10px; }
  .res-tools button.on{ background:var(--ink); color:var(--paper); }
  .grid-wrap{ overflow-x:auto; border:1px solid var(--line); background:var(--paper); }
  #resultSec.stale .grid-wrap, #resultSec.stale .verdict, #resultSec.stale .traces{ opacity:.38; }
  table.grid{ border-collapse:collapse; width:100%; min-width:720px; }
  .grid th, .grid td{ border-bottom:1px solid var(--line); border-right:1px solid var(--line); vertical-align:top; text-align:left; }
  .grid tr > *:last-child{ border-right:0; }
  .grid tbody tr:last-child > *{ border-bottom:0; }
  .grid thead th{ font-weight:600; font-size:13px; padding:10px 12px; letter-spacing:.08em; }
  .grid tbody th{ font-weight:500; padding:12px; width:76px; }
  .grid td{ padding:10px 12px; min-width:140px; height:64px; }
  .grid tbody tr{ animation:rowin .35s ease-out both; }
  @keyframes rowin{ from{ opacity:0; transform:translateY(-4px);} }
  .grid tr.cut th, .grid tr.cut td{ color:var(--faint); height:44px; }
  .who{ display:flex; align-items:center; gap:7px; font-size:13px; margin-bottom:5px; }
  .who.sleep{ color:var(--muted); }
  .who.gone{ color:var(--faint); }
  .who.gone .tok{ background:var(--paper); color:var(--faint); border:1px dashed var(--faint); }
  .who.sneak{ color:var(--bad); }
  .item{ display:inline-block; font-size:12px; border:1px solid var(--ink); padding:0 6px; margin:2px 4px 4px 0; }
  .item.bad{ border-color:var(--bad); color:var(--bad); }
  .ev{ font-size:12px; color:var(--muted); margin-top:2px; }
  .ev::before{ content:"— "; }
  .ev.bad{ color:var(--bad); font-weight:600; }
  .ev.wit{ color:var(--ink); }
  .ev.hid{ color:var(--bad); font-style:italic; }
  .verdict{ margin-top:16px; font-size:16px; font-weight:600; }
  .verdict.ok{ color:var(--ok); }
  .verdict.bad{ color:var(--bad); }
  .traces{ margin-top:8px; font-size:13px; color:#3d3c38; }
  .traces .lbl{ color:var(--muted); margin-right:8px; }

  #truthSec{ border:1px solid var(--ink); background:var(--paper); padding:22px 24px; }
  #truthSec[hidden]{ display:none; }
  #truthSec .lead{ color:var(--muted); font-size:13px; margin:6px 0 14px; }
  .truth{ list-style:none; padding:0; margin:0 0 20px; }
  .truth li{ display:grid; grid-template-columns:100px 1fr auto; gap:14px; padding:10px 0; border-top:1px solid var(--line); }
  .truth .w{ font-weight:600; }
  .truth .s{ font-size:12px; color:var(--muted); white-space:nowrap; }
  .truth .s.hit{ color:var(--ink); }
  .next{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .next button{ background:var(--ink); color:var(--paper); padding:10px 20px; font-weight:600; }
  .next span{ font-size:13px; color:var(--muted); }

  .two{ display:grid; grid-template-columns:1fr 1fr; gap:40px; }
  .two ul, .two ol{ list-style:none; padding:0; margin:0; }
  #clues li{ padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; display:grid; grid-template-columns:56px 44px 1fr; gap:8px; }
  #clues .n, #clues .r, #runs .n{ color:var(--muted); }
  .empty, #clues li.empty, #runs li.empty{ display:block; color:var(--faint); font-size:13px; padding:9px 0; cursor:default; }
  #runs li{ padding:12px 0; border-bottom:1px solid var(--line); font-size:13px; display:grid; grid-template-columns:44px 1fr auto; column-gap:12px; row-gap:4px; cursor:pointer; }
  #runs li:hover .cfg{ text-decoration:underline; text-underline-offset:3px; }
  #runs li.shown .cfg, #runs li.shown .n{ font-weight:600; color:var(--ink); }
  #runs .cl{ grid-column:2 / 4; display:grid; grid-template-columns:52px 1fr; gap:8px; color:#3d3c38; }
  #runs .cl .k{ color:var(--muted); }
  #runs .cl .nw{ font-size:11px; border:1px solid var(--ink); padding:0 4px; margin-left:6px; color:var(--ink); }
  #runs .cl.none{ color:var(--faint); }
  #runs .res{ white-space:nowrap; }
  #runs .res.bad{ color:var(--bad); }
  #runs .res.ok{ color:var(--ok); }
  #hintSec[hidden]{ display:none; }
  #guide[hidden]{ display:none; }
  main[hidden]{ display:none; }
  .credit{ max-width:1640px; margin:0 auto; padding:0 32px 40px; font-size:12px; color:var(--faint); letter-spacing:.06em; }
  #soonView[hidden]{ display:none; }
  #soonView{ max-width:1640px; margin:0 auto; padding:40px 32px 80px; }
  .soon-box{ border:1px dashed var(--faint); padding:72px 24px; text-align:center; }
  .soon-tab{ font-size:13px; color:var(--muted); letter-spacing:.2em; }
  .soon-box h1{ margin:8px 0 10px; color:var(--muted); }
  .soon-box p{ margin:0; color:var(--faint); font-size:14px; }
  .tab.soon{ color:var(--faint); }
  .tab.soon.cur{ color:var(--muted); border-bottom-color:var(--faint); }
  #guideList{ list-style:none; margin:0; padding:0; counter-reset:g; }
  #guideList li{ counter-increment:g; display:grid; grid-template-columns:32px 1fr; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; line-height:1.7; color:var(--muted); }
  #guideList li::before{ content:counter(g); font-variant-numeric:tabular-nums; color:var(--faint); }
  #guideList li.done{ color:var(--faint); }
  #guideList li.done::before{ content:"✓"; color:var(--ok); }
  #guideList li.now{ color:var(--ink); }
  #guideList li.now::before{ color:var(--ink); font-weight:700; }
  .hint-count{ font-size:13px; color:var(--muted); }
  .hint-btn{ margin-left:auto; font-size:13px; border:1px solid var(--ink); padding:3px 12px; }
  .hint-btn:hover{ background:var(--ink); color:var(--paper); }
  .hint-btn:disabled{ border-color:var(--line); color:var(--faint); cursor:default; background:none; }
  #hints{ list-style:none; margin:0; padding:0; counter-reset:h; }
  #hints li{ counter-increment:h; display:grid; grid-template-columns:32px 1fr; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; color:#3d3c38; animation:rowin .35s ease-out both; }
  #hints li::before{ content:counter(h); color:var(--muted); font-variant-numeric:tabular-nums; }
  #hints .none{ display:block; color:var(--faint); }
  #hints .none::before{ content:none; }
  #achSec[hidden]{ display:none; }
  .ach{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; }
  .ach .a{ border:1px solid var(--line); background:var(--paper); padding:10px 12px; }
  .ach .a b{ display:block; font-size:14px; }
  .ach .a span{ font-size:12px; color:var(--muted); }
  .ach .a.lock{ background:transparent; border-style:dashed; }
  .ach .a.lock b{ color:var(--faint); font-weight:500; }
  .ach .a.lock span{ color:var(--faint); }
  .ach .a.new{ border-color:var(--ink); }
  .ach .a.lock.open b{ color:var(--muted); }
  .ach .a.lock.open span{ color:var(--faint); }
  .restart{ margin-top:36px; padding-top:20px; border-top:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .restart button{ border:1px solid var(--ink); padding:7px 16px; font-size:13px; }
  .restart button:hover{ background:var(--ink); color:var(--paper); }
  .restart span{ font-size:12px; color:var(--faint); }
  #newDlg{ position:fixed; inset:0; background:rgba(246,245,241,.9); display:grid; place-items:center; z-index:70; padding:20px; }
  #newDlg[hidden]{ display:none; }
  #newDlg .box{ background:var(--paper); border:1px solid var(--ink); padding:24px; width:min(420px,100%); }
  #newDlg h3{ margin:0 0 8px; font-size:17px; }
  #newDlg p{ margin:0 0 20px; color:#3d3c38; font-size:14px; }
  #newDlg .btns{ display:flex; justify-content:flex-end; gap:10px; }
  #newDlg .btns button{ border:1px solid var(--ink); padding:8px 16px; }
  #newDlg .btns .go{ background:var(--ink); color:var(--paper); }
  #achToast{ position:fixed; right:24px; bottom:24px; z-index:60; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  #achToast .t{ background:var(--ink); color:var(--paper); padding:12px 16px; min-width:240px; max-width:320px; animation:toastin .3s ease-out both; }
  #achToast .t small{ display:block; font-size:11px; letter-spacing:.2em; color:#a9a7a0; }
  #achToast .t b{ display:block; font-size:16px; margin:2px 0; }
  #achToast .t span{ font-size:12px; color:#d6d4cd; }
  #achToast .t.out{ animation:toastout .3s ease-in both; }
  @keyframes toastin{ from{ opacity:0; transform:translateY(8px);} }
  @keyframes toastout{ to{ opacity:0; transform:translateY(8px);} }
  .rules{ margin:28px 0 0; padding:0; list-style:none; font-size:13px; color:#3d3c38; }
  .rules li{ padding:4px 0; }
  .rules li::before{ content:"·"; margin-right:8px; color:var(--muted); }

  @media (max-width:760px){
    .top{ padding:0 18px; gap:14px; } main{ padding:28px 18px 60px; }
    #tabs{ order:3; flex-basis:100%; gap:18px; overflow-x:auto; }
    .brand .motto{ display:none; }
    .top .spacer{ display:none; }
    .two{ grid-template-columns:1fr; }
    .truth li{ grid-template-columns:1fr; gap:2px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">时间侦探<span class="motto">——“平庸侦探破解发生的案件，而我，阻止案件的发生。”</span></div>
  <nav id="tabs"></nav><span class="spacer"></span>
  <div id="runCount" class="num"></div>
</header>

<main>
  <section>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p id="brief"></p>
    <p id="note" hidden></p>
    <div class="goal">目标<b id="goal"></b></div>
  </section>

  <section id="guide" hidden>
    <div class="sec-head"><h2>玩法教学</h2><span id="guideCount" class="hint-count num"></span></div>
    <ol id="guideList"></ol>
  </section>


  <section>
    <div class="sec-head"><h2>明线</h2></div>
    <div class="lines" id="lines"></div>
    <div class="scene-strip" id="scene"></div>
  </section>

  <section class="run-bar">
    <button id="runBtn">推演这一夜</button>
  </section>

  <section id="resultSec" hidden>
    <div class="sec-head">
      <h2 id="resTitle">推演结果</h2><p id="resSub"></p>
      <div class="res-tools" id="resTools" hidden><button id="vMing" class="on">明线</button><button id="vReal">真实经过</button></div>
    </div>
    <div class="grid-wrap"><table class="grid" id="grid"></table></div>
    <div class="verdict" id="verdict"></div>
    <div class="traces" id="traces"></div>
  </section>

  <section id="truthSec" hidden></section>

  <section id="hintSec">
    <div class="sec-head"><h2>提示</h2><span id="hintCount" class="hint-count num"></span>
      <button id="hintBtn" class="hint-btn">揭开一条提示</button></div>
    <ol id="hints"></ol>
  </section>

  <section>
    <div class="sec-head"><h2>推演记录</h2></div>
    <ol id="runs"></ol>
  </section>

  <section id="achSec">
    <div class="sec-head"><h2>成就</h2><span id="achCount" class="hint-count num"></span></div>
    <div class="ach" id="ach"></div>
  </section>

  <div class="restart"><button id="newBtn">新开局</button><span>清空本案的推演记录、提示和成就，从头再来。其他案子不受影响。</span></div>
</main>

<section id="soonView" hidden>
  <div class="soon-box">
    <div class="soon-tab" id="soonTab"></div>
    <h1>开发中</h1>
    <p>新的案子还在编写，敬请期待。</p>
  </div>
</section>

<footer class="credit">时间侦探 · 制作者：Azphire</footer>

<div id="achToast" aria-live="polite"></div>
<div id="newDlg" hidden><div class="box">
  <h3>确定要新开局吗？</h3>
  <p id="newText">本案的推演记录、已揭开的提示和已解锁的成就都会被清空，无法恢复。</p>
  <div class="btns"><button id="newNo">取消</button><button class="go" id="newYes">确定新开局</button></div>
</div></div>


<script>
/* =========================================================
   时间侦探 · 推演引擎
   ---------------------------------------------------------
   明线（tree）：每个人的一串时间点，可以分叉。
     · 节点 { id, label, room, awake, does?, doesText? }
       does(w) 是明面上的动作（大家都看得见），比如锁门。
     · 分叉 { fork:[ { cond:'若…', test:w=>bool, path:[...] }, ..., { cond:'否则', path:[...] } ] }
       走到分叉时，按「上一个钟点结束时」的世界状态选路——也就是别人在前面做过的事。
       cond 只用于破案后的揭晓；推演中玩家看不到分叉条件，没走过的分支也不显示。
     · 走到末尾就停在最后一个节点（不一定睡着，可能正醒着等机会）。
   暗线（rules）：每个钟点按顺序检查，条件满足就发生，玩家看不见。
     · c.sneak(人, 房间)：偷偷离开明线上的位置。推演表仍显示明线位置；
       如果原房间里有别人醒着，他们会注意到这个人不见了（证词）。
   ========================================================= */

function prepTree(ch) {
  ch.nodes = {}; ch.order = [];
  const walk = (arr, depth, conds) => {
    arr.forEach((el, i) => {
      if (el.fork) {
        el.fork.forEach(b => walk(b.path, depth + i, conds.concat([b.cond])));
        return;
      }
      el.depth = depth + i; el.conds = conds;
      const nx = arr[i + 1];
      el.next = nx ? (nx.fork ? { fork:nx.fork } : { node:nx }) : null;
      ch.nodes[el.id] = el; ch.order.push(el);
    });
  };
  walk(ch.tree, 0, []);
}
function advance(node, w) {
  if (!node.next) return node;
  if (node.next.node) return node.next.node;
  const b = node.next.fork.find(b => !b.test || b.test(w));
  return b.path[0];
}

function simulate(cs, starts) {
  const w = cs.world();
  const out = { hours:[], clues:[], truth:[], badAt:null };
  const cur = {};
  cs.hours.forEach((hour, t) => {
    if (out.badAt != null) { out.hours.push({ hour, cut:true }); return; }   // 案发后这一夜就停在那里
    cs.chars.forEach(ch => {
      cur[ch.id] = t === 0 ? ch.nodes[starts[ch.id]] : advance(cur[ch.id], w);
    });
    const pos = {}, real = {};
    cs.chars.forEach(ch => {
      const n = cur[ch.id];
      pos[ch.id] = { room:n.room, awake:n.awake, label:n.label, node:n.id };
      real[ch.id] = { room:n.room, awake:n.awake };
    });
    const events = [], hidden = [], sneaks = [];
    const c = {
      t, hour, w,
      name:id => cs.chars.find(x => x.id === id).name,
      at:(id, nodeId) => pos[id].node === nodeId,
      atAny:(id, ids) => ids.includes(pos[id].node),
      awake:id => real[id].awake,
      room:id => real[id].room,
      awakeIn:(room, except) => cs.chars.filter(ch => ch.id !== except && real[ch.id].room === room && real[ch.id].awake).map(ch => ch.id),
      see:(room, text, bad) => events.push({ room, text, bad:!!bad }),
      doze:(id, text) => { real[id].awake = false; hidden.push({ room:real[id].room, text, who:id }); },
      wake:(id, text) => { real[id].awake = true; if (text) hidden.push({ room:real[id].room, text, who:id }); },
      sneak:(id, room, text, silent) => {
        const from = real[id].room;
        real[id].room = room;
        if (!silent) sneaks.push({ id, from, to:room });
        hidden.push({ room, text:text || `${cs.chars.find(x => x.id === id).name}偷偷来到${room}`, who:id, from });
      },
    };
    // 明面上的动作
    cs.chars.forEach(ch => {
      const n = cur[ch.id];
      if (n.does) {
        const r = n.does(w, t, pos);
        if (r && typeof r === 'object') {            // { text, label }：这个钟点的动作和明线写的不一样
          if (r.label) pos[ch.id].label = r.label;
          if (r.text) events.push({ room:n.room, text:r.text });
        } else if (r !== false && r !== undefined || (r === undefined && n.doesText)) {
          events.push({ room:n.room, text: typeof r === 'string' ? r : n.doesText });
        }
      }
    });
    // 暗线
    for (const r of cs.rules) {
      if (!r.when(c)) continue;
      const preClue = typeof r.clue === 'function' ? r.clue(c) : null;
      r.act(c);
      out.truth.push({ hour, rule:r.id });
      if (r.note) hidden.push({ room:r.noteRoom ? r.noteRoom(c) : null, text:r.note });
      if (r.bad) {
        if (out.badAt == null) out.badAt = hour;
        if (cs.badSeen) events.push({ room:cs.badRoomFn ? cs.badRoomFn(w) : cs.badRoom, text:cs.badSeen, bad:true });
      }
      if (r.clue) {
        const cl = preClue || r.clue;
        const text = typeof cl.text === 'function' ? cl.text(c) : cl.text;
        if (!out.clues.some(x => x.text === text)) out.clues.push({ hour, room:cl.room, text, rule:r.id });
      }
    }
    // 证词：偷偷离开时，原房间里醒着的人会注意到
    sneaks.forEach(s => {
      if (w.dark) return;            // 停电时谁也看不清
      const wit = cs.chars.filter(ch => ch.id !== s.id && real[ch.id].room === s.from && real[ch.id].awake);
      if (wit.length) {
        const nm = cs.chars.find(x => x.id === s.id).name;
        const tx = `${wit.map(x => x.name).join('、')}说：${nm}有一阵子不在${s.from}`;
        events.push({ room:s.from, text:tx, witness:true });
        out.clues.push({ hour, room:s.from, text:`${hour} ${tx}。`, rule:'witness' });
      }
    });
    out.hours.push({ hour, pos, real:JSON.parse(JSON.stringify(real)), items:cs.items(w), events, hidden });
  });
  out.end = cs.ending(w);
  return out;
}

/* ---------- 成就（保存在这个浏览器里） ---------- */
const achKey = cs => 'timedet-ach-' + cs.id;
function loadAch(cs) {
  try { return new Set(JSON.parse(localStorage.getItem(achKey(cs)) || '[]')); } catch (e) { return new Set(); }
}
function saveAch(cs, set) {
  try { localStorage.setItem(achKey(cs), JSON.stringify([...set])); } catch (e) {}
}
const achState = CASES.map(cs => ({ got:loadAch(cs), fresh:new Set() }));
function checkAch(r) {
  const cs = CS(), s = ST(), A = achState[ci];
  const x = { r, s, cs, fired:new Set(r.truth.map(t => t.rule)),
    initial:cs.chars.every(c => s.starts[c.id] === c.start) };
  const newly = (cs.achievements || []).filter(a => !A.got.has(a.id) && a.test(x));
  newly.forEach(a => { A.got.add(a.id); A.fresh.add(a.id); });
  if (newly.length) { saveAch(cs, A.got); newly.forEach((a, i) => setTimeout(() => toastAch(a), 500 + i * 900)); }
  renderAch();
}
function renderAch() {
  const cs = CS(), A = achState[ci], list = cs.achievements || [];
  $('#achSec').hidden = !list.length;
  if (!list.length) return;
  $('#achCount').textContent = `${list.filter(a => A.got.has(a.id)).length} / ${list.length}`;
  $('#ach').innerHTML = list.map(a => A.got.has(a.id)
    ? `<div class="a ${A.fresh.has(a.id) ? 'new' : ''}"><b>${a.name}</b><span>${a.desc}</span></div>`
    : a.open ? `<div class="a lock open"><b>${a.name}</b><span>${a.desc}</span></div>`
    : `<div class="a lock"><b>？？？</b><span>未解锁</span></div>`).join('');
}
function toastAch(a) {
  const box = $('#achToast'), el = document.createElement('div');
  el.className = 't';
  el.innerHTML = `<small>成就解锁</small><b>${a.name}</b><span>${a.desc}</span>`;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 3200);
}

/* ---------- 明线 ---------- */
function leafCount(arr) {
  let n = 1;
  arr.forEach(el => { if (el.fork) n = el.fork.reduce((a, b) => a + leafCount(b.path), 0); });
  return n;
}
function reachFrom(node) {
  const set = new Set(), q = [node];
  while (q.length) {
    const n = q.shift(); if (set.has(n)) continue; set.add(n);
    if (!n.next) continue;
    if (n.next.node) q.push(n.next.node); else n.next.fork.forEach(b => q.push(b.path[0]));
  }
  return set;
}
function ancestors(ch, node) {
  const set = new Set();
  const walk = (arr, trail) => {
    for (const el of arr) {
      if (el.fork) { el.fork.forEach(b => walk(b.path, trail.slice())); return; }
      if (el === node) { trail.forEach(x => set.add(x)); return; }
      trail.push(el);
    }
  };
  walk(ch.tree, []);
  return set;
}

function renderLines() {
  const cs = CS(), s = ST(), box = $('#lines'), H = cs.hours.length;
  const cur = s.shown >= 0 && sameStarts(s.runs[s.shown].starts, s.starts) ? s.runs[s.shown].r : null;
  box.innerHTML = '';
  cs.chars.forEach(ch => {
    const start = ch.nodes[s.starts[ch.id]];
    const reach = reachFrom(start), anc = ancestors(ch, start);
    const taken = new Set(cur ? cur.hours.filter(h => !h.cut).map(h => h.pos[ch.id].node) : []);
    const nodeHTML = n => {
      let cls, tag = '';
      if (reach.has(n)) {
        const k = n.depth - start.depth;
        if (k < H) { cls = 'in'; tag = !n.next && k < H - 1 ? `${cs.hours[k]}–${cs.hours[H - 1]}` : cs.hours[k]; }
        else cls = 'out';
      } else cls = anc.has(n) ? 'past' : 'off';
      if (anc.has(n)) tag = '已过去';
      if (n === start) cls += ' start';
      if (taken.has(n.id)) cls += ' taken';
      return `<button class="node ${cls}" data-id="${n.id}">
        <span class="dot"></span>
        <span class="st"><span class="st-l">${n.label}</span><br><span class="st-m">${n.room}${n.doesText ? ' · ' + n.doesText.replace(/了$/, '') : ''}</span></span>
        <span class="tag num">${tag}</span></button>`;
    };
    const known = b => s.solved || b.path.some(n => s.revealed.has(n.id));
    const pathHTML = arr => `<div class="path">${arr.map(el => el.fork
      ? `<div class="fork">${el.fork.map(b => {
          if (!known(b)) return `<div class="branch unknown"><div class="cond">&nbsp;</div><div class="q">？</div></div>`;
          const live = cur && b.path.some(n => taken.has(n.id));
          return `<div class="branch ${live ? 'live' : ''}"><div class="cond">${s.solved ? b.cond : '&nbsp;'}</div>${pathHTML(b.path)}</div>`;
        }).join('')}</div>`
      : nodeHTML(el)).join('')}</div>`;
    const visW = arr => {           // 这一列需要的宽度：已知分支各占一份，「？」占一小格
      let w = 0;
      arr.forEach(el => { if (el.fork) w = el.fork.reduce((a, b) => a + (known(b) ? visW(b.path) : 60), 0); });
      return w || 175;
    };
    const col = document.createElement('div');
    col.className = 'line' + (ch.fixed ? ' fixed' : '');
    col.style.flex = `1 0 ${Math.max(ch.fixed ? 188 : 158, visW(ch.tree) + 36)}px`;
    col.innerHTML = `<div class="line-head"><span class="tok">${ch.short}</span><b>${ch.name}</b>${ch.fixed ? '<em>无法调整</em>' : ''}</div>${pathHTML(ch.tree)}`;
    if (!ch.fixed) col.querySelectorAll('.node').forEach(b => b.onclick = () => setStart(ch.id, b.dataset.id));
    box.appendChild(col);
  });
  $('#scene').innerHTML = `<b>现场</b>${cs.scene.map(x => `<span>${x}</span>`).join('')}`;
}

function setStart(id, nodeId) {
  const s = ST();
  s.touched[id] = true;
  if (s.starts[id] !== nodeId) s.starts[id] = nodeId;
  renderLines(); markStale();
  renderGuide();
}
function markStale() {
  const s = ST();
  if (s.shown < 0) return;
  const same = sameStarts(s.runs[s.shown].starts, s.starts);
  $('#resultSec').classList.toggle('stale', !same);
  $('#resSub').textContent = same ? subText(s.shown) : '明线已改动，需要重新推演';
}
const subText = i => (i === ST().runs.length - 1 ? '' : '回看 · ') + cfgText(CS(), ST().runs[i].starts);

/* ---------- 推演 ---------- */
function run() {
  const cs = CS(), s = ST();
  const r = simulate(cs, { ...s.starts });
  s.runs.push({ starts:{ ...s.starts }, r });
  r.hours.forEach(h => { if (!h.cut) Object.values(h.pos).forEach(p => s.revealed.add(p.node)); });
  const n = s.runs.length;
  new Set(r.truth.map(x => x.rule)).forEach(id => s.fired[id] = (s.fired[id] || 0) + 1);
  if (r.end.ok) s.solved = true;
  const first = (cs.hints || [])[0];
  if (first && first.autoAt && n >= first.autoAt && s.hintsOpen < 1) { s.hintsOpen = 1; renderHints(); }
  showResult(n - 1, true);
  checkAch(r);
  renderGuide();
  renderRuns(); renderTabs();
  if (s.solved) renderTruth();
  $('#resultSec').scrollIntoView({ behavior:'smooth', block:'start' });
}

function showResult(i, fresh) {
  const cs = CS(), s = ST(), { r } = s.runs[i];
  s.shown = i;
  if (fresh) s.real = false;
  const sec = $('#resultSec');
  sec.hidden = false; sec.classList.remove('stale');
  $('#resTitle').textContent = `第 ${i + 1} 次推演`;
  $('#resSub').textContent = subText(i);
  $('#resTools').hidden = !s.solved;
  $('#vMing').classList.toggle('on', !s.real);
  $('#vReal').classList.toggle('on', s.real);
  const real = s.solved && s.real;
  const head = `<thead><tr><th></th>${cs.rooms.map(rm => `<th>${rm}</th>`).join('')}</tr></thead>`;
  const body = r.hours.map((h, k) => {
    if (h.cut) return `<tr class="cut" style="animation-delay:${fresh ? k * 0.12 : 0}s"><th class="num">${h.hour}</th><td colspan="${cs.rooms.length}">案发之后，推演到此为止</td></tr>`;
    const cells = cs.rooms.map(rm => {
      let who = '';
      cs.chars.forEach(c => {
        const p = h.pos[c.id], q = h.real[c.id];
        if (!real) {
          if (p.room === rm) who += `<div class="who"><span class="tok">${c.short}</span>${p.label}</div>`;
          return;
        }
        if (q.room === rm) {
          const moved = q.room !== p.room, dozed = p.awake && !q.awake;
          const cls = moved ? 'sneak' : (q.awake ? '' : 'sleep');
          who += `<div class="who ${cls}"><span class="tok ${cls}">${c.short}</span>${p.label}${moved ? '（其实在这里）' : ''}${dozed ? '（打瞌睡）' : ''}</div>`;
        } else if (p.room === rm) {
          who += `<div class="who gone"><span class="tok">${c.short}</span>${p.label}（人不在）</div>`;
        }
      });
      const items = h.items.filter(it => it.room === rm).map(it => `<span class="item ${it.bad ? 'bad' : ''}">${it.text}</span>`).join('');
      let evs = h.events.filter(e => e.room === rm).map(e => `<div class="ev ${e.bad ? 'bad' : ''} ${e.witness ? 'wit' : ''}">${e.text}</div>`).join('');
      if (real) evs += h.hidden.filter(e => e.room === rm).map(e => `<div class="ev hid">${e.text}</div>`).join('');
      return `<td>${who}${items}${evs}</td>`;
    }).join('');
    return `<tr style="animation-delay:${fresh ? k * 0.12 : 0}s"><th class="num">${h.hour}</th>${cells}</tr>`;
  }).join('');
  $('#grid').innerHTML = head + `<tbody>${body}</tbody>`;
  const v = $('#verdict');
  v.className = 'verdict ' + (r.end.ok ? 'ok' : 'bad');
  v.textContent = (r.end.ok ? '✓ ' : '✕ ') + r.end.text;
  const tr = r.clues.map(c => c.rule === 'witness' ? c.text : `${c.room}：${c.text}`);
  $('#traces').innerHTML = `<span class="lbl">痕迹与证词</span>${tr.length ? tr.join('　') : '没有发现异常'}`;
  renderRuns(); renderLines();
}
function setView(real) { ST().real = real; showResult(ST().shown, false); }

function renderHints() {
  const cs = CS(), s = ST(), list = cs.hints || [];
  $('#hintSec').hidden = !list.length;
  if (!list.length) return;
  $('#hintCount').textContent = `${s.hintsOpen} / ${list.length}`;
  $('#hints').innerHTML = s.hintsOpen
    ? list.slice(0, s.hintsOpen).map(t => `<li>${typeof t === 'string' ? t : t.text}</li>`).join('')
    : '<li class="none">提示从弱到强排列，可以一条一条揭开。</li>';
  const b = $('#hintBtn');
  b.disabled = s.hintsOpen >= list.length;
  b.textContent = s.hintsOpen >= list.length ? '提示已全部揭开' : (s.hintsOpen ? '再揭开一条' : '揭开一条提示');
}
function revealHint() {
  const s = ST();
  if (s.hintsOpen < (CS().hints || []).length) { s.hintsOpen++; renderHints(); }
}
function renderRuns() {
  const ol = $('#runs'), cs = CS(), s = ST();
  if (!s.runs.length) { ol.innerHTML = '<li class="empty">还没有推演。</li>'; return; }
  const seen = new Set();
  const rows = s.runs.map((x, i) => {
    const cl = x.r.clues.map(c => {
      const txt = c.rule === 'witness' ? c.text : c.text;
      const nw = !seen.has(txt); seen.add(txt);
      return `<div class="cl"><span class="k">${c.rule === 'witness' ? '证词' : c.room}</span><span>${txt}${nw ? '<span class="nw">新</span>' : ''}</span></div>`;
    }).join('') || '<div class="cl none"><span></span><span>没有发现异常</span></div>';
    return `<li data-i="${i}" class="${i === s.shown ? 'shown' : ''}">
      <span class="n num">#${i + 1}</span><span class="cfg">${cfgText(cs, x.starts)}</span>
      <span class="res ${x.r.end.ok ? 'ok' : 'bad'}">${x.r.end.ok ? '✓ 阻止' : '✕ 案发'}</span>${cl}</li>`;
  });
  ol.innerHTML = rows.reverse().join('');
  ol.querySelectorAll('li[data-i]').forEach(li => li.onclick = () => {
    const i = +li.dataset.i;
    ST().starts = { ...ST().runs[i].starts };
    showResult(i, false);
    $('#resultSec').scrollIntoView({ behavior:'smooth', block:'start' });
  });
}

function forkList(cs) {
  const out = [];
  cs.chars.forEach(ch => {
    const walk = (arr, prev) => arr.forEach((el, i) => {
      if (!el.fork) return;
      const before = arr[i - 1] || prev;
      out.push({ who:ch.name, text:`「${before.label}」之后：` + el.fork.map(b => `${b.cond}，${b.path.map(n => n.label + '（' + n.room + '）').join(' → ')}`).join('；') + '。' });
      el.fork.forEach(b => walk(b.path, before));
    });
    walk(ch.tree, null);
  });
  return out;
}
function renderTruth() {
  const cs = CS(), s = ST(), sec = $('#truthSec');
  const firstWin = s.runs.findIndex(x => x.r.end.ok) + 1;
  const next = CASES[ci + 1];
  sec.innerHTML = `
    <h2>真相 · 暗线</h2>
    <p class="lead">第 ${firstWin} 次推演告破。</p>
    <ul class="truth">${cs.rules.filter(r => !r.hideTruth).map(r => `<li><span class="w">${r.who}</span><span>${r.truth}</span>
      <span class="s ${s.fired[r.id] ? 'hit' : ''}">${s.fired[r.id] ? `在 ${s.fired[r.id]} 次推演中发生过` : '从未被触发'}</span></li>`).join('')}</ul>
    <h2 style="margin-top:6px">分叉的条件</h2>
    <p class="lead">推演时看不到的岔路口：</p>
    <ul class="truth">${forkList(cs).map(f => `<li><span class="w">${f.who}</span><span>${f.text}</span><span class="s"></span></li>`).join('')}</ul>
    ${next ? `<div class="next"><button id="nextBtn">下一案：${next.title} →</button></div>` : ''}`;
  sec.hidden = false;
  if (next) $('#nextBtn').onclick = () => openCase(ci + 1);
  $('#resTools').hidden = false;
}

function freshState(cs) {
  return {
    starts:Object.fromEntries(cs.chars.map(c => [c.id, c.start])),
    runs:[], fired:{}, shown:-1, solved:false, real:false, hintsOpen:0, touched:{},
    revealed:new Set(cs.chars.map(c => c.start)),   // 走过（或起点所在）的节点；没走过的分支显示为「？」
  };
}
function newGame() {
  const cs = CS();
  state[ci] = freshState(cs);
  achState[ci] = { got:new Set(), fresh:new Set() };
  saveAch(cs, achState[ci].got);
  $('#achToast').innerHTML = '';
  $('#newDlg').hidden = true;
  openCase(ci);
}
$('#newBtn').addEventListener('click', () => {
  $('#newText').textContent = `「${CS().title}」的推演记录、已揭开的提示和已解锁的成就都会被清空，无法恢复。其他案子不受影响。`;
  $('#newDlg').hidden = false;
});
$('#newNo').addEventListener('click', () => { $('#newDlg').hidden = true; });
$('#newDlg').addEventListener('click', e => { if (e.target.id === 'newDlg') $('#newDlg').hidden = true; });
$('#newYes').addEventListener('click', newGame);
$('#runBtn').addEventListener('click', run);
$('#hintBtn').addEventListener('click', revealHint);
$('#vMing').addEventListener('click', () => setView(false));
$('#vReal').addEventListener('click', () => setView(true));
openCase(0);
</script>

</body>
</html>
